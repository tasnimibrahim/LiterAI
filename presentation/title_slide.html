<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiterAI - Title Slide</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Lora:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F8FAFC 0%, #F0F4F8 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .left-section {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            z-index: 2;
        }
        
        .accent-line {
            width: 4px;
            height: 60px;
            background: #0066CC;
            margin-bottom: 20px;
        }
        
        .main-title {
            font-family: 'Poppins', sans-serif;
            font-size: 72px;
            font-weight: 600;
            color: #0F172A;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-family: 'Lora', serif;
            font-size: 28px;
            font-weight: 400;
            color: #334155;
            line-height: 1.4;
        }
        
        .tagline {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #0066CC;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 20px;
        }
        
        .right-section {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .geometric-accent {
            position: absolute;
            width: 500px;
            height: 500px;
        }
        
        .circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 3px solid #0066CC;
            border-radius: 50%;
            top: 50%;
            right: 100px;
            transform: translateY(-50%);
            opacity: 0.3;
        }
        
        .circle-2 {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #7C3AED;
            border-radius: 50%;
            bottom: 100px;
            right: 50px;
            opacity: 0.2;
        }
        
        .circle-3 {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid #0066CC;
            border-radius: 50%;
            top: 80px;
            right: 150px;
            opacity: 0.4;
        }
        
        .vertical-line {
            position: absolute;
            width: 2px;
            height: 400px;
            background: #0066CC;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-section">
            <div class="accent-line"></div>
            <div>
                <h1 class="main-title">LiterAI</h1>
                <p class="subtitle">AI-Powered Academic Research Assistant</p>
                <p class="tagline">Accelerate Your Research with AI</p>
            </div>
        </div>
        
        <div class="right-section">
            <div class="geometric-accent">
                <div class="vertical-line"></div>
                <div class="circle-1"></div>
                <div class="circle-2"></div>
                <div class="circle-3"></div>
            </div>
        </div>
    </div>
</body>
</html>
